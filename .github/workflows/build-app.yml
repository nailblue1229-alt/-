name: build-app

on:
  push:
    branches:
      - claude/xiaohongshu-batch-downloader-wj1a44
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build app
        env:
          PYTHONIOENCODING: utf-8
        run: python build_app.py

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp dist/XHS-Downloader.exe release/
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: XHS-Downloader-Windows
          path: release/
          if-no-files-found: error

      - name: Publish "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest release/XHS-Downloader.exe \
            --target "${{ github.sha }}" \
            --title "샤오홍슈 일괄 다운로더 (윈도우)" \
            --notes "XHS-Downloader.exe 를 받아서 더블클릭하세요. 파이썬 설치는 필요 없습니다.
          처음 실행할 때 'Windows에서 PC를 보호했습니다' 창이 뜨면 추가 정보 -> 실행 을 누르세요."
