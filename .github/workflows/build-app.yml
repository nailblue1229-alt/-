name: build-app

on:
  push:
    branches:
      - claude/xiaohongshu-batch-downloader-wj1a44
      - claude/xiaohongshu-batch-downloader-ttv0u8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run extension tests
        run: node --test tests/extension.test.js

      - name: Build app
        env:
          PYTHONIOENCODING: utf-8
        run: python build_app.py

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp README.md dist/XHS-Downloader/README.md
          cd dist && 7z a -tzip ../release/XHS-Downloader-Windows.zip XHS-Downloader
          cd ..
          # 압축을 풀면 manifest.json 을 담은 폴더가 그대로 나오도록 묶습니다.
          # 크롬의 '압축해제된 확장 프로그램 로드'는 폴더를 지정해야 합니다.
          mkdir -p pack && cp -r extension pack/xhs-extension
          cd pack && 7z a -tzip ../release/XHS-Chrome-Extension.zip xhs-extension
          cd ..
          ls -la release

      - name: Record checksum
        shell: bash
        run: |
          sha256sum release/XHS-Downloader-Windows.zip release/XHS-Chrome-Extension.zip \
            | tee release/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: XHS-Downloader-Windows
          path: release/
          if-no-files-found: error

      - name: Publish "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SUM=$(grep Windows release/SHA256.txt | cut -d' ' -f1)
          EXTSUM=$(grep Extension release/SHA256.txt | cut -d' ' -f1)
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest \
            release/XHS-Downloader-Windows.zip \
            release/XHS-Chrome-Extension.zip \
            --target "${{ github.sha }}" \
            --title "샤오홍슈 일괄 다운로더" \
            --notes "## 크롬 확장 프로그램 (권장)

          **XHS-Chrome-Extension.zip** — 로그인된 크롬 안에서 동작하므로 쿠키 설정이 필요 없습니다.
          압축을 풀고 \`chrome://extensions\` → 개발자 모드 켜기 → '압축해제된 확장 프로그램을 로드합니다'
          → 푼 폴더를 선택하세요.

          ## 데스크톱 프로그램

          **XHS-Downloader-Windows.zip** — zip을 풀고 폴더 안의 XHS-Downloader.exe 를 실행하세요.
          샤오홍슈가 로그인 없는 접속을 막고 있어 현재는 대부분의 노트에서 실패합니다.

          커밋: ${{ github.sha }}
          빌드 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA256 (Windows): \`$SUM\`
          SHA256 (확장): \`$EXTSUM\`"
