name: build-app

on:
  push:
    branches:
      - claude/xiaohongshu-batch-downloader-wj1a44
      - claude/xiaohongshu-batch-downloader-ttv0u8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build app
        env:
          PYTHONIOENCODING: utf-8
        run: python build_app.py

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp README.md dist/XHS-Downloader/README.md
          cd dist && 7z a -tzip ../release/XHS-Downloader-Windows.zip XHS-Downloader
          cd .. && ls -la release

      - name: Record checksum
        shell: bash
        run: |
          sha256sum release/XHS-Downloader-Windows.zip | tee release/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: XHS-Downloader-Windows
          path: release/
          if-no-files-found: error

      - name: Publish "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SUM=$(cut -d' ' -f1 release/SHA256.txt)
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest release/XHS-Downloader-Windows.zip \
            --target "${{ github.sha }}" \
            --title "샤오홍슈 일괄 다운로더 (윈도우)" \
            --notes "zip을 풀고 폴더 안의 XHS-Downloader.exe 를 실행하세요. 파이썬 설치는 필요 없습니다.

          커밋: ${{ github.sha }}
          빌드 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          zip SHA256: \`$SUM\`

          내려받은 파일이 위 해시와 같은지 확인하려면 PowerShell에서:
          \`Get-FileHash .\\XHS-Downloader-Windows.zip -Algorithm SHA256\`"
